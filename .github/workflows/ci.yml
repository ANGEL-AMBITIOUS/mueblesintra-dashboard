name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  kpi-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The KPI mapping is dependency-free TypeScript; Node 24 strips the types, so no install is needed.
      - run: node --test lib/kpis.test.ts
